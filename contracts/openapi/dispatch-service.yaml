openapi: 3.1.0
info:
  title: SwiftDrop Dispatch and Reports API
  version: 2.0.0
  description: |
    Dispatching, courier workload and delivery reports (Member 7).

    Dispatch owns only its assignments and the parcel status events it stores.
    Parcels are read from parcel-service (`GET /api/parcels/dispatch`) and
    couriers from courier-service (`GET /api/couriers/profiles`), forwarding the
    caller's token. Every assignment is also recorded in parcel-service
    (`PATCH /api/parcels/{id}/courier`).

    Courier ids: `courierId` is always the courier-service **profile id**
    (integer). The courier's identity user id appears only as `userId` /
    `courierUserId`; it is what parcel-service stores and what parcel status
    events carry as `courierId`.

    Errors have the body `{"error": "message"}`. Dates are UTC.
servers:
  - url: http://localhost:8085
security:
  - bearerAuth: []
tags:
  - name: Dispatch
  - name: Courier hand-off
  - name: Reports
paths:
  /api/dispatch/parcels/unassigned:
    get:
      tags: [Dispatch]
      summary: Parcels waiting for a courier
      description: |
        CREATED parcels from parcel-service that have no ACTIVE assignment.
        Roles: DISPATCHER, ADMIN.
      parameters:
        - {name: pickupArea, in: query, schema: {type: string}}
        - {name: dropoffArea, in: query, schema: {type: string}}
        - {name: from, in: query, description: Created on or after this date, schema: {type: string, format: date}}
        - {name: to, in: query, description: Created on or before this date, schema: {type: string, format: date}}
        - {name: size, in: query, schema: {type: string, maxLength: 30}}
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/pageSize'}
        - {name: sort, in: query, schema: {type: string, enum: [createdAt, updatedAt, trackingNumber, pickupArea, dropoffArea, size], default: createdAt}}
        - {name: direction, in: query, schema: {type: string, enum: [asc, desc], default: asc}}
      responses:
        '200':
          description: A page of waiting parcels
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ParcelPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/dispatch/parcels/{parcelId}:
    get:
      tags: [Dispatch]
      summary: One parcel with its stored status events and assignments
      description: Roles DISPATCHER, ADMIN.
      parameters:
        - {$ref: '#/components/parameters/parcelId'}
      responses:
        '200':
          description: Parcel detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ParcelDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/dispatch/couriers:
    get:
      tags: [Dispatch]
      summary: Couriers with their workload
      description: |
        Every active courier profile from courier-service, sorted by name, with
        its number of ACTIVE assignments. Roles DISPATCHER, ADMIN.
      responses:
        '200':
          description: Couriers
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CourierWorkload'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/dispatch/assignments:
    get:
      tags: [Dispatch]
      summary: Search assignments
      description: Newest first. Roles DISPATCHER, ADMIN.
      parameters:
        - {name: state, in: query, schema: {type: string, enum: [ACTIVE, COMPLETED, CANCELLED]}}
        - {name: courierId, in: query, description: Courier profile id, schema: {type: integer, format: int64, minimum: 1}}
        - {name: trackingNumber, in: query, description: Case-insensitive partial match, schema: {type: string}}
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/pageSize'}
      responses:
        '200':
          description: A page of assignments
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssignmentPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Dispatch]
      summary: Assign a courier to a waiting parcel
      description: |
        The parcel must be CREATED with no ACTIVE assignment, and the courier
        active with availability AVAILABLE. The assignment is recorded in
        parcel-service in the same transaction (a failure there rolls it back),
        then `parcel.assigned` is published. Roles DISPATCHER, ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parcelId, courierId]
              properties:
                parcelId: {type: string, format: uuid}
                courierId: {type: integer, format: int64, minimum: 1, description: Courier profile id}
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssignmentResult'}
        '400':
          description: Invalid body, or "Courier not found"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: |
            "Parcel is not waiting for a courier", "Parcel already has an active
            assignment", "Courier must be active and AVAILABLE", or
            "Parcel service refused the courier assignment"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/dispatch/assignments/{parcelId}/reassign:
    post:
      tags: [Dispatch]
      summary: Move the parcel's active assignment to another courier
      description: |
        Only while the parcel is CREATED (not picked up). The previous
        assignment becomes CANCELLED and its version increases by one.
        Roles DISPATCHER, ADMIN.
      parameters:
        - {$ref: '#/components/parameters/parcelId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courierId]
              properties:
                courierId: {type: integer, format: int64, minimum: 1, description: New courier's profile id}
      responses:
        '200':
          description: The new assignment, with previousCourierId set
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssignmentResult'}
        '400':
          description: Invalid body, or "Courier not found"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: |
            "Courier can only be changed before pickup", "Parcel has no active
            assignment", "Parcel is already assigned to this courier", or
            "Courier must be active and AVAILABLE"
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/dispatch/assignments/{parcelId}/cancel:
    post:
      tags: [Dispatch]
      summary: Cancel the parcel's active assignment before pickup
      description: |
        The parcel returns to the waiting list. Parcel-service has no
        un-assign call yet (request R1), so its stored courier stays until the
        next assignment overwrites it. Roles DISPATCHER, ADMIN.
      parameters:
        - {$ref: '#/components/parameters/parcelId'}
      responses:
        '200':
          description: The cancelled assignment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssignmentResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '"An assignment can only be cancelled before pickup" or "Parcel has no active assignment"'
          content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/dispatch/deliveries:
    get:
      tags: [Dispatch]
      summary: Deliveries by their latest stored status
      description: |
        Built from the stored parcel status events. Without `status`, returns
        parcels whose latest status is PICKED_UP, IN_TRANSIT or
        OUT_FOR_DELIVERY. Most recently updated first. Roles DISPATCHER, ADMIN.
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [PICKED_UP, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, FAILED]}}
        - {name: trackingNumber, in: query, description: Case-insensitive partial match, schema: {type: string}}
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/pageSize'}
      responses:
        '200':
          description: A page of deliveries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/dispatch/couriers/{courierId}/assignments:
    get:
      tags: [Courier hand-off]
      summary: A courier's assignments (read by courier-service)
      description: |
        All assignments of the courier profile, oldest first, in the shape
        courier-service reads. Roles COURIER, DISPATCHER, ADMIN; a COURIER may
        only read assignments that belong to their own user id (403 otherwise).
        `version` changes only when dispatch cancels or reassigns the
        assignment, never when a delivery event completes it.
      parameters:
        - {name: courierId, in: path, required: true, description: Courier profile id, schema: {type: integer, format: int64, minimum: 1}}
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CourierAssignment'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/dispatch/reports/summary:
    get:
      tags: [Reports]
      summary: Delivery report for a date range
      description: |
        Built only from the parcel status events stored by dispatch. `from` and
        `to` are inclusive UTC dates, at most two years apart.
        successRate = DELIVERED / (DELIVERED + FAILED) x 100, rounded to two
        decimals (0 when there are none); failureRate = 100 - successRate.
        activeDeliveriesPerCourier counts parcels whose latest status at the
        end of the range is PICKED_UP, IN_TRANSIT or OUT_FOR_DELIVERY.
        Roles DISPATCHER, ADMIN.
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DispatchSummary'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    page:
      {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
    pageSize:
      {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    parcelId:
      {name: parcelId, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    BadRequest:
      description: Invalid input
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unauthorized:
      description: Missing, invalid or expired JWT
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Forbidden:
      description: The caller's role may not use this endpoint
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFound:
      description: Parcel not found
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    BadGateway:
      description: parcel-service or courier-service gave an unusable answer
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Unavailable:
      description: parcel-service, courier-service or the dispatch database is unavailable
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
    Parcel:
      type: object
      description: A parcel as parcel-service returns it.
      properties:
        parcelId: {type: string, format: uuid}
        trackingNumber: {type: string}
        pickupArea: {type: string}
        dropoffArea: {type: string}
        pickupAddress: {type: string}
        deliveryAddress: {type: string}
        size: {type: string}
        status: {type: string, enum: [CREATED, PICKED_UP, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, FAILED, CANCELLED]}
        courierUserId: {type: [integer, 'null'], format: int64}
        charge: {type: [number, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ParcelPage:
      type: object
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/Parcel'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer}
        totalPages: {type: integer}
    StatusEvent:
      type: object
      properties:
        previousStatus: {type: [string, 'null']}
        newStatus: {type: string}
        changedAt: {type: string, format: date-time}
    ParcelDetail:
      type: object
      properties:
        parcel: {$ref: '#/components/schemas/Parcel'}
        history: {type: array, items: {$ref: '#/components/schemas/StatusEvent'}}
        assignments: {type: array, items: {$ref: '#/components/schemas/AssignmentRow'}}
    CourierWorkload:
      type: object
      properties:
        courierId: {type: integer, format: int64, description: Courier profile id}
        userId: {type: integer, format: int64}
        name: {type: string}
        active: {type: boolean}
        availability: {type: string, enum: [AVAILABLE, BUSY, OFFLINE]}
        available: {type: boolean, description: active and availability is AVAILABLE}
        activeParcelCount: {type: integer}
    AssignmentResult:
      type: object
      properties:
        assignmentId: {type: string, format: uuid}
        parcelId: {type: string, format: uuid}
        trackingNumber: {type: string}
        courierId: {type: integer, format: int64}
        courierName: {type: string}
        previousCourierId: {type: [integer, 'null'], format: int64}
        assignedBy: {type: string, description: Identity user id of the dispatcher}
        assignedAt: {type: string, format: date-time}
        state: {type: string, enum: [ACTIVE, COMPLETED, CANCELLED]}
    AssignmentRow:
      type: object
      properties:
        assignmentId: {type: string, format: uuid}
        parcelId: {type: string, format: uuid}
        trackingNumber: {type: string}
        courierId: {type: integer, format: int64}
        courierName: {type: string}
        assignedBy: {type: string}
        assignedAt: {type: string, format: date-time}
        state: {type: string, enum: [ACTIVE, COMPLETED, CANCELLED]}
        parcelStatus: {type: string, description: Latest stored status event, or CREATED if none}
    AssignmentPage:
      type: object
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/AssignmentRow'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer}
        totalPages: {type: integer}
    CourierAssignment:
      type: object
      required: [id, parcelId, courierId, attemptNo, active, version, deliveryDate, assignedAt]
      properties:
        id: {type: string, format: uuid}
        parcelId: {type: string, format: uuid}
        courierId: {type: integer, format: int64, description: Courier profile id}
        attemptNo: {type: integer, minimum: 1, description: Position among all assignments of the parcel}
        active: {type: boolean}
        version: {type: integer, minimum: 0}
        deliveryDate: {type: string, format: date}
        assignedAt: {type: string, format: date-time}
    Delivery:
      type: object
      properties:
        parcelId: {type: string, format: uuid}
        trackingNumber: {type: string}
        status: {type: string}
        courierId: {type: [integer, 'null'], format: int64}
        courierName: {type: [string, 'null']}
        lastUpdatedAt: {type: string, format: date-time}
    DeliveryPage:
      type: object
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/Delivery'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer}
        totalPages: {type: integer}
    DispatchSummary:
      type: object
      required: [deliveriesPerDay, successRate, failureRate, countsByStatus, activeDeliveriesPerCourier]
      properties:
        deliveriesPerDay:
          type: array
          description: One entry per day in the range, including days with no deliveries.
          items:
            type: object
            properties:
              date: {type: string, format: date}
              delivered: {type: integer}
              failed: {type: integer}
              total: {type: integer}
        successRate: {type: number}
        failureRate: {type: number}
        countsByStatus:
          type: array
          description: Stored status events in the range, by new status.
          items:
            type: object
            properties:
              status: {type: string}
              count: {type: integer}
        activeDeliveriesPerCourier:
          type: array
          items:
            type: object
            properties:
              courierId: {type: [integer, 'null'], format: int64, description: Profile id when dispatch knows the courier}
              courierUserId: {type: string, description: The courier id carried by the status events}
              courierName: {type: [string, 'null']}
              count: {type: integer}
