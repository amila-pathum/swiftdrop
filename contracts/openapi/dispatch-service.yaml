openapi: 3.1.0
info:
  title: SwiftDrop Dispatch and Reports API
  version: 1.0.0
  description: |
    Dispatcher/Admin APIs. Parcel and courier data uses owner-service HTTP
    clients when DISPATCH_DATA_SOURCE=http, or the explicitly selected Dispatch
    demo projection fallback when DISPATCH_DATA_SOURCE=projection.
servers:
  - url: http://localhost:8085
security:
  - bearerAuth: []
tags:
  - name: Dispatch
  - name: Reports
paths:
  /api/dispatch/parcels/unassigned:
    get:
      tags: [Dispatch]
      summary: List unassigned CREATED parcels
      description: Supports area, size, date, pagination and allow-listed sorting filters.
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/pageSize'}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: pickupArea, in: query, schema: {type: string, maxLength: 120}}
        - {name: dropoffArea, in: query, schema: {type: string, maxLength: 120}}
        - {name: size, in: query, schema: {type: string, maxLength: 30}}
        - {$ref: '#/components/parameters/sort'}
        - {name: direction, in: query, schema: {type: string, enum: [asc, desc], default: asc}}
      responses:
        '200': {$ref: '#/components/responses/ParcelPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/dispatch/parcels:
    get:
      tags: [Dispatch]
      summary: Search all parcels
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/pageSize'}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: status, in: query, schema: {type: string}}
        - {name: courierId, in: query, schema: {type: string, format: uuid}}
        - {name: trackingNumber, in: query, schema: {type: string, maxLength: 80}}
        - {$ref: '#/components/parameters/sort'}
        - {$ref: '#/components/parameters/direction'}
      responses:
        '200': {$ref: '#/components/responses/ParcelPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/dispatch/parcels/{parcelId}:
    get:
      tags: [Dispatch]
      summary: Get parcel details and status timeline
      parameters:
        - {$ref: '#/components/parameters/parcelId'}
      responses:
        '200':
          description: Parcel detail and ordered status history
          content:
            application/json:
              schema:
                type: object
                properties:
                  parcel: {$ref: '#/components/schemas/Parcel'}
                  history:
                    type: array
                    items: {$ref: '#/components/schemas/StatusHistory'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/dispatch/deliveries:
    get:
      tags: [Dispatch]
      summary: Search delivery records by status and tracking number
      parameters:
        - {$ref: '#/components/parameters/page'}
        - {$ref: '#/components/parameters/pageSize'}
        - {name: status, in: query, schema: {type: string, enum: [PICKED_UP, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, FAILED]}}
        - {name: trackingNumber, in: query, schema: {type: string, maxLength: 80}}
        - {$ref: '#/components/parameters/sort'}
        - {$ref: '#/components/parameters/direction'}
      responses:
        '200': {$ref: '#/components/responses/ParcelPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/dispatch/assignments:
    post:
      tags: [Dispatch]
      summary: Assign or reassign a courier to a CREATED parcel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parcelId, courierId]
              properties:
                parcelId: {type: string, format: uuid}
                courierId: {type: string, format: uuid}
      responses:
        '200':
          description: Active assignment and audit record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Assignment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Parcel is not CREATED, already assigned, or courier is unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /api/dispatch/assignments/{parcelId}/cancel:
    post:
      tags: [Dispatch]
      summary: Cancel a parcel's active assignment before pickup
      parameters:
        - {$ref: '#/components/parameters/parcelId'}
      responses:
        '200':
          description: Cancelled assignment record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Assignment'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/dispatch/couriers:
    get:
      tags: [Dispatch]
      summary: List courier availability and active workload
      responses:
        '200':
          description: Courier workload list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    courierId: {type: string, format: uuid}
                    name: {type: string}
                    active: {type: boolean}
                    available: {type: boolean}
                    activeParcelCount: {type: integer}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/dispatch/couriers/{courierId}/parcels:
    get:
      tags: [Dispatch]
      summary: List active assignments for a courier service consumer
      parameters:
        - {name: courierId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Active assigned parcels
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    parcelId: {type: string, format: uuid}
                    trackingNumber: {type: [string, 'null']}
                    status: {type: [string, 'null']}
                    assignedAt: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/dispatch/reports/summary:
    get:
      tags: [Reports]
      summary: Event-based daily deliveries, outcomes, status counts and active courier workload
      parameters:
        - {$ref: '#/components/parameters/from'}
        - {$ref: '#/components/parameters/to'}
      responses:
        '200':
          description: Summary from uniquely stored parcel status events
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DispatchSummary'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/dispatch/reports/status:
    get:
      tags: [Reports]
      summary: Parcels entering each status during the date range
      parameters: [{$ref: '#/components/parameters/from'}, {$ref: '#/components/parameters/to'}]
      responses:
        '200':
          description: Counts for CREATED, PICKED_UP, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED and FAILED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusReport'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/dispatch/reports/volume:
    get:
      tags: [Reports]
      summary: Delivered parcels per day or week
      parameters:
        - {$ref: '#/components/parameters/from'}
        - {$ref: '#/components/parameters/to'}
        - {name: groupBy, in: query, schema: {type: string, enum: [day, week], default: day}}
      responses:
        '200':
          description: Period and parcel count rows
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    period: {type: string}
                    count: {type: integer}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/dispatch/reports/courier-performance:
    get:
      tags: [Reports]
      summary: Courier handled, delivered, failed and delivery-time metrics
      parameters: [{$ref: '#/components/parameters/from'}, {$ref: '#/components/parameters/to'}]
      responses:
        '200': {description: Courier performance aggregates}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/dispatch/reports/failed-deliveries:
    get:
      tags: [Reports]
      summary: Failed parcels and available reasons
      parameters: [{$ref: '#/components/parameters/from'}, {$ref: '#/components/parameters/to'}]
      responses:
        '200': {description: Failed delivery records; reason may be null if the source event omitted it}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/dispatch/reports/revenue-by-route:
    get:
      tags: [Reports]
      summary: Recorded parcel fees grouped by pickup and drop-off area
      description: Uses the parcel charge and area projection, not Pricing zone calculations.
      parameters: [{$ref: '#/components/parameters/from'}, {$ref: '#/components/parameters/to'}]
      responses:
        '200': {description: Route fee aggregates}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/dispatch/reports/{report}.csv:
    get:
      tags: [Reports]
      summary: Export a report as CSV
      parameters:
        - {name: report, in: path, required: true, schema: {type: string, enum: [status, volume, courier-performance, failed-deliveries, revenue-by-route]}}
        - {$ref: '#/components/parameters/from'}
        - {$ref: '#/components/parameters/to'}
        - {name: groupBy, in: query, schema: {type: string, enum: [day, week], default: day}}
      responses:
        '200':
          description: UTF-8 CSV download
          content:
            text/csv:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Dispatcher or Admin role required.
  parameters:
    page:
      {name: page, in: query, schema: {type: integer, minimum: 0, default: 0}}
    pageSize:
      {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    from:
      {name: from, in: query, required: true, schema: {type: string, format: date}}
    to:
      {name: to, in: query, required: true, schema: {type: string, format: date}}
    sort:
      {name: sort, in: query, schema: {type: string, enum: [createdAt, updatedAt, trackingNumber, status, pickupArea, dropoffArea, size], default: createdAt}}
    direction:
      {name: direction, in: query, schema: {type: string, enum: [asc, desc], default: desc}}
    parcelId:
      {name: parcelId, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Invalid or absent JWT
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Dispatcher or Admin role required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: Request conflicts with the current assignment or parcel state
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ParcelPage:
      description: Paginated parcel rows
      content:
        application/json:
          schema:
            type: object
            properties:
              content: {type: array, items: {$ref: '#/components/schemas/Parcel'}}
              page: {type: integer}
              size: {type: integer}
              totalElements: {type: integer}
              totalPages: {type: integer}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
    Parcel:
      type: object
      properties:
        parcelId: {type: string, format: uuid}
        trackingNumber: {type: string}
        pickupArea: {type: string}
        dropoffArea: {type: string}
        pickupAddress: {type: string}
        deliveryAddress: {type: string}
        size: {type: string}
        status: {type: string}
        courierId: {type: [string, 'null'], format: uuid}
        courierName: {type: [string, 'null']}
        charge: {type: number}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    StatusHistory:
      type: object
      properties:
        previousStatus: {type: [string, 'null']}
        newStatus: {type: string}
        changedAt: {type: string, format: date-time}
        changedBy: {type: [string, 'null']}
        note: {type: [string, 'null']}
    Assignment:
      type: object
      properties:
        assignmentId: {type: string, format: uuid}
        parcelId: {type: string, format: uuid}
        courierId: {type: string, format: uuid}
        previousCourierId: {type: [string, 'null'], format: uuid}
        assignedBy: {type: string}
        assignedAt: {type: string, format: date-time}
        state: {type: string, enum: [ACTIVE, COMPLETED, CANCELLED]}
    StatusReport:
      type: array
      items:
        type: object
        properties:
          status: {type: string}
          count: {type: integer}
    DispatchSummary:
      type: object
      required: [deliveriesPerDay, successRate, countsByStatus, activeDeliveriesPerCourier]
      properties:
        deliveriesPerDay:
          type: array
          items:
            type: object
            properties:
              date: {type: string, format: date}
              delivered: {type: integer}
              failed: {type: integer}
              total: {type: integer}
        successRate: {type: number, description: Percentage of DELIVERED events among DELIVERED and FAILED events}
        countsByStatus: {$ref: '#/components/schemas/StatusReport'}
        activeDeliveriesPerCourier:
          type: array
          items:
            type: object
            properties:
              courierId: {type: string}
              count: {type: integer}
