openapi: 3.0.3
info:
  title: SwiftDrop Pricing & Zones
  version: 1.0.0
  description: JWT authenticated API. City lookup is case-insensitive and trims surrounding
    whitespace. Money uses HALF_UP rounding to two decimal places. Express fee is
    the rounded amount minus rounded base and weight fees.
servers:
- url: http://localhost:8080
  description: API Gateway
- url: http://localhost:8086
  description: Pricing service
security:
- bearerAuth: []
paths:
  /api/zones:
    get:
      summary: List active entries; ADMIN may include inactive entries
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Zone'
        '400':
          description: Invalid input; validation errors include fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: includeInactive
        in: query
        schema:
          type: boolean
          default: false
        description: true requires ADMIN; false is available to any authenticated
          user.
    post:
      summary: Create entry (ADMIN)
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
        '400':
          description: Invalid input; validation errors include fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Administrator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Zone or pricing rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Duplicate city, active rule, or disabled zone conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZoneInput'
  /api/zones/{id}:
    parameters: &id001
    - name: id
      in: path
      required: true
      schema: &id002
        type: string
        format: uuid
    get:
      summary: Get entry by ID (any authenticated user, including inactive entries)
