components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    ZoneInput:
      type: object
      required:
      - name
      - city
      - district
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        city:
          type: string
          minLength: 1
          maxLength: 100
        district:
          type: string
          minLength: 1
          maxLength: 100
    RuleInput:
      type: object
      required:
      - baseFee
      - pricePerKg
      - expressMultiplier
      properties:
        baseFee:
          type: number
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
        pricePerKg:
          type: number
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
        expressMultiplier:
          type: number
          minimum: 1
          maximum: 999.99
          multipleOf: 0.01
    QuoteRequest:
      type: object
      required:
      - pickupCity
      - deliveryCity
      - weight
      - serviceType
      properties:
        pickupCity:
          type: string
          minLength: 1
        deliveryCity:
          type: string
          minLength: 1
        weight:
          type: number
          minimum: 0.001
          maximum: 9999999.999
          multipleOf: 0.001
        serviceType:
          type: string
          enum:
          - STANDARD
          - EXPRESS
    Quote:
      type: object
      required:
      - amount
      - currency
      - breakdown
      properties:
        amount:
          type: number
          multipleOf: 0.01
        currency:
          type: string
          enum:
          - LKR
        breakdown:
          type: object
          required:
          - baseFee
          - weightFee
          - expressFee
          properties:
            baseFee:
              type: number
              multipleOf: 0.01
            weightFee:
              type: number
              multipleOf: 0.01
            expressFee:
              type: number
              multipleOf: 0.01
    Zone:
      allOf:
      - $ref: '#/components/schemas/ZoneInput'
      - type: object
        required:
        - id
        - active
        - createdAt
        - updatedAt
        properties:
          id: *id002
          active: &id004
            type: boolean
          createdAt: &id005
            type: string
            format: date-time
          updatedAt: &id006
            type: string
            format: date-time
    CreateRule:
      allOf:
      - $ref: '#/components/schemas/RuleInput'
      - type: object
        required:
        - zoneId
        properties:
          zoneId: *id002
    Rule:
      allOf:
      - $ref: '#/components/schemas/RuleInput'
      - type: object
        required:
        - id
        - active
        - createdAt
        - updatedAt
        - zoneId
        - zoneName
        properties:
          id: *id002
          active: *id004
          createdAt: *id005
          updatedAt: *id006
          zoneId: *id002
          zoneName:
            type: string
