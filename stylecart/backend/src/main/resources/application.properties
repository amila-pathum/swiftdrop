spring.application.name=stylecart
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
server.address=127.0.0.1
server.port=${STYLECART_BACKEND_PORT:8090}
server.ssl.enabled=${STYLECART_TLS_ENABLED:false}
server.ssl.key-store=${STYLECART_TLS_KEYSTORE:file:target/local-tls/stylecart.p12}
server.ssl.key-store-password=${STYLECART_TLS_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=stylecart
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${STYLECART_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.error.include-message=never
spring.datasource.url=jdbc:postgresql://${STYLECART_DB_HOST:localhost}:${STYLECART_DB_PORT:5440}/stylecart_db
spring.datasource.username=${STYLECART_DB_USERNAME:stylecart}
spring.datasource.password=${STYLECART_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=false
stylecart.admin.email=${STYLECART_ADMIN_EMAIL:admin@stylecart.local}
stylecart.admin.password=${STYLECART_ADMIN_PASSWORD:}
stylecart.settings-key=${STYLECART_SETTINGS_KEY:}
stylecart.gateway=${SWIFTDROP_GATEWAY_URL:http://localhost:8080}
stylecart.allowed-gateways=${SWIFTDROP_ALLOWED_GATEWAYS:http://localhost:8080,http://127.0.0.1:8080}
stylecart.api-key=${SWIFTDROP_API_KEY:}
stylecart.webhook-secret=${SWIFTDROP_WEBHOOK_SECRET:}
stylecart.public-url=${STYLECART_PUBLIC_URL:https://localhost:8090}
