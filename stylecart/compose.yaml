name: stylecart-demo
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: stylecart_db
      POSTGRES_USER: ${STYLECART_DB_USERNAME:-stylecart}
      POSTGRES_PASSWORD: ${STYLECART_DB_PASSWORD:?Set STYLECART_DB_PASSWORD in the StyleCart .env}
    ports:
      - "127.0.0.1:${STYLECART_DB_PORT:-5440}:5432"
    volumes:
      - stylecart-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d stylecart_db"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  stylecart-data:
