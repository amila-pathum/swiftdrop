spring.application.name=courier-service

server.port=${COURIER_SERVICE_PORT:8084}

# Courier Service owns courier_db and connects as courier_service; no other service uses this
# database. The databases and users are created by
# infrastructure/docker/postgres/init (see the root README).
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/courier_db
spring.datasource.username=courier_service
spring.datasource.password=${COURIER_DB_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only
# checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Verifies JWTs issued by the Identity Service (same JWT_SECRET); see
# config/SecurityConfig.
swiftdrop.jwt.secret=${JWT_SECRET}

server.error.include-message=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Private proof storage and bounded multipart requests.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
swiftdrop.proofs.directory=${COURIER_PROOF_DIRECTORY:.data/courier-proofs}
swiftdrop.clients.identity-url=${IDENTITY_SERVICE_URL:http://localhost:8081}
swiftdrop.clients.dispatch-url=${DISPATCH_SERVICE_URL:http://localhost:8085}
swiftdrop.clients.parcel-url=${PARCEL_SERVICE_URL:http://localhost:8082}
