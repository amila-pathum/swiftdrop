# Opt-in profile for the AWS RDS development instance:
#   DB_PROFILE=rds infrastructure/scripts/run-service.sh courier-service
# Everything not set here comes from application.properties. Without this
# profile the service keeps using the local Docker PostgreSQL (courier_db).
# All values come from the environment (the root .env.rds, mapped by
# run-service.sh); see the root README, "Running the services against AWS
# RDS". Never put a password or secret in this file.

# The RDS instance holds one independent database per service. This service
# connects only to its own database (courier_db on RDS) as its own login user
# (courier_user), which owns that database; DB_NAME, DB_USERNAME and DB_PASSWORD
# are set from the COURIER_DB_* variables.
# sslmode=require: every connection (Flyway uses the same DataSource) is
# encrypted with TLS, and the driver refuses to connect without it. The
# server certificate is NOT verified, so this protects against eavesdropping
# but not against an attacker impersonating the server.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# A small pool: the db.t4g.micro instance is shared by every service and
# developer.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.connection-timeout=15000

# The database belongs to this service alone, so everything lives in its
# standard "public" schema: Flyway keeps its history table there and runs the
# migrations there; Hibernate validates and queries it and never creates or
# alters tables.
spring.flyway.default-schema=public
spring.flyway.schemas=public
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.hibernate.ddl-auto=validate

# Never baseline: baselining exists only for local databases created by
# Hibernate before Flyway. A non-empty "public" schema without Flyway history
# fails startup instead of having its first migration silently skipped.
spring.flyway.baseline-on-migrate=false
