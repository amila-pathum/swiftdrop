spring.application.name=parcel-service

server.port=${PARCEL_SERVICE_PORT:8082}

# Parcel Service owns parcel_db and connects as parcel_service; no other service uses this
# database. The databases and users are created by
# infrastructure/docker/postgres/init (see the root README).
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/parcel_db
spring.datasource.username=parcel_service
spring.datasource.password=${PARCEL_DB_PASSWORD}

# Parcel status changes are published through RabbitMQ. Use the credentials from
# the root .env; the IPv4 fallback avoids Windows resolving localhost to ::1.
spring.rabbitmq.host=${RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:swiftdrop}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only
# checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Verifies JWTs issued by the Identity Service (same JWT_SECRET); see
# config/SecurityConfig.
swiftdrop.jwt.secret=${JWT_SECRET}

server.error.include-message=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Provisional pricing API: POST quote-path, JSON response {"charge": 450.00}.
swiftdrop.pricing.base-url=${PRICING_SERVICE_URL:http://localhost:8086}
swiftdrop.pricing.quote-path=${PRICING_QUOTE_PATH:/api/pricing/quote}
