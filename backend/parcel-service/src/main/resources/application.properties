spring.application.name=parcel-service

server.port=${PARCEL_SERVICE_PORT:8082}

# Parcel Service owns parcel_db and connects as parcel_service; no other service uses this
# database. The databases and users are created by
# infrastructure/docker/postgres/init (see the root README).
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/parcel_db
spring.datasource.username=postgres
spring.datasource.password=${PARCEL_DB_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only
# checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Verifies JWTs issued by the Identity Service (same JWT_SECRET); see
# config/SecurityConfig.
swiftdrop.jwt.secret=${JWT_SECRET}

server.error.include-message=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
