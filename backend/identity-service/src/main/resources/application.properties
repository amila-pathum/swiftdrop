spring.application.name=identity-service

server.port=${IDENTITY_SERVICE_PORT:8081}

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/identity_db
spring.datasource.username=swiftdrop
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only
# checks that the entities match it. Databases created by Hibernate before
# Flyway are recorded as version 1 (V1__baseline.sql) and then migrated
# forward; empty databases run every migration.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema created by Hibernate before Flyway

server.error.include-message=never

# Only the health check is exposed, without details; it is public (SecurityConfig).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# First administrator (optional, see AdminBootstrap). Set both or neither; an
# existing account with this email is never changed. Remove them afterwards.
swiftdrop.admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:}
swiftdrop.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}
swiftdrop.admin.bootstrap-name=${ADMIN_BOOTSTRAP_NAME:SwiftDrop Administrator}

# Google sign-in is optional: it is enabled when both GOOGLE_CLIENT_ID and
# GOOGLE_CLIENT_SECRET are set, and startup fails if only one of them is.
# The redirect URI goes through the API Gateway and must match the one
# registered with Google.
swiftdrop.google.client-id=${GOOGLE_CLIENT_ID:}
swiftdrop.google.client-secret=${GOOGLE_CLIENT_SECRET:}
swiftdrop.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
# Where the browser is sent after Google sign-in (/auth/google/callback).
swiftdrop.frontend-origin=${FRONTEND_ORIGIN:http://localhost:3000}

# Rate limiting (instance-local; not distributed). Per email, fixed window.
swiftdrop.rate-limit.max-attempts=${RATE_LIMIT_MAX_ATTEMPTS:10}
swiftdrop.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:900}

# The session only holds an in-progress Google sign-in; the API stays stateless.
server.servlet.session.timeout=10m
server.servlet.session.cookie.same-site=lax
