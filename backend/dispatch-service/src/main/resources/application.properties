spring.application.name=dispatch-service

server.port=${DISPATCH_SERVICE_PORT:8085}

# Dispatch Service owns dispatch_db and connects as dispatch_service; no other service uses this
# database. The databases and users are created by
# infrastructure/docker/postgres/init (see the root README).
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/dispatch_db
spring.datasource.username=dispatch_service
spring.datasource.password=${DISPATCH_DB_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only
# checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Verifies JWTs issued by the Identity Service (same JWT_SECRET); see
# config/SecurityConfig.
swiftdrop.jwt.secret=${JWT_SECRET}

server.error.include-message=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.rabbit.enabled=false

# Shared event broker (the exchange and reports queue are provisioned by Compose).
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:swiftdrop}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:swiftdrop}

# Parcel and Courier are the owners of their data. Their HTTP APIs are
# provisional until those services publish their read contracts; projection
# mode is the explicit local fallback for the existing Dispatch-owned demo data.
swiftdrop.dispatch.data-source=${DISPATCH_DATA_SOURCE:projection}
swiftdrop.parcel.base-url=${PARCEL_SERVICE_URL:http://localhost:8082}
swiftdrop.parcel.created-path=${PARCEL_CREATED_PATH:/api/parcels?status=CREATED}
swiftdrop.parcel.path=${PARCEL_PATH:/api/parcels/{parcelId}}
swiftdrop.courier.base-url=${COURIER_SERVICE_URL:http://localhost:8084}
swiftdrop.courier.list-path=${COURIER_LIST_PATH:/api/couriers}
swiftdrop.courier.path=${COURIER_PATH:/api/couriers/{courierId}}
