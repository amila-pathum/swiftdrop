spring.application.name=dispatch-service

server.port=${DISPATCH_SERVICE_PORT:8085}

# Dispatch Service owns dispatch_db and connects as dispatch_service; no other service uses this
# database. The databases and users are created by
# infrastructure/docker/postgres/init (see the root README).
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/dispatch_db
spring.datasource.username=dispatch_service
spring.datasource.password=${DISPATCH_DB_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only
# checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Verifies JWTs issued by the Identity Service (same JWT_SECRET); see
# config/SecurityConfig.
swiftdrop.jwt.secret=${JWT_SECRET}

server.error.include-message=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.rabbit.enabled=false

# Shared event broker (the exchange and reports queue are provisioned by Compose).
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:swiftdrop}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:swiftdrop}

# A status event that fails for a reason other than being invalid (for example
# the database being down) is retried, then dead-lettered instead of being
# requeued forever. Invalid events are rejected at once (ParcelStatusChangedConsumer).
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2

# Parcel and Courier own their data; dispatch reads and updates it only through
# their APIs, forwarding the caller's access token.
swiftdrop.parcel.base-url=${PARCEL_SERVICE_URL:http://localhost:8082}
swiftdrop.parcel.created-path=${PARCEL_CREATED_PATH:/api/parcels/dispatch?status=CREATED}
swiftdrop.parcel.path=${PARCEL_PATH:/api/parcels/dispatch/{parcelId}}
swiftdrop.parcel.assign-courier-path=${PARCEL_ASSIGN_COURIER_PATH:/api/parcels/{parcelId}/courier}
swiftdrop.courier.base-url=${COURIER_SERVICE_URL:http://localhost:8084}
swiftdrop.courier.profiles-path=${COURIER_PROFILES_PATH:/api/couriers/profiles?active=true&page={page}&size={size}}
