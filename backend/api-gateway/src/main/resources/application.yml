spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-auth
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                # Registration (customer, merchant, courier), sign-in, logout and
                # password reset. The Identity Service decides which are public.
                - Path=/api/auth/**
            # Browser redirects of the Google sign-in flow. Redirects, query
            # strings and the short-lived session cookie pass through unchanged.
            - id: identity-google-sign-in
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/oauth2/authorization/google,/login/oauth2/code/google
            - id: identity-users
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                # /api/users/me and its sub-paths (profile, change-password), and
                # account administration, which the Identity Service limits to ADMIN.
                - Path=/api/users/**,/api/admin/users/**
            # One path prefix per service. A service owns everything under its prefix.
            # Notification Service is internal (backend calls and RabbitMQ) and has no route.
            - id: parcel-service
              uri: ${PARCEL_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/parcels/**
            - id: merchant-service
              uri: ${MERCHANT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/merchants/**
            - id: courier-service
              uri: ${COURIER_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/couriers/**
            - id: dispatch-service
              uri: ${DISPATCH_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/dispatch/**
            - id: pricing-service
              uri: ${PRICING_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/pricing/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/notifications/**
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - ${FRONTEND_ORIGIN:http://localhost:3000}
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: [Authorization, Content-Type]
                max-age: 3600
          httpclient:
            connect-timeout: 3000
server:
  port: ${GATEWAY_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
