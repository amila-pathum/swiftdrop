# Opt-in profile for the shared AWS RDS development database:
#   SPRING_PROFILES_ACTIVE=rds
# Everything not set here comes from application.properties. Without this
# profile the service keeps using the local Docker PostgreSQL (pricing_db).
# All values come from the environment; see the root README, "Running the
# services against AWS RDS". Never put a password or secret in this file.

# sslmode=require: every connection (Flyway uses the same DataSource) is
# encrypted with TLS, and the driver refuses to connect without it. The
# server certificate is NOT verified, so this protects against eavesdropping
# but not against an attacker impersonating the server.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# A small pool: the db.t4g.micro instance is shared by every service and
# developer.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.connection-timeout=15000

# The shared database holds one schema per service; this service owns
# "pricing". Flyway creates it if missing, keeps its history table in it and
# runs the migrations there; Hibernate validates and queries it and never
# creates or alters tables.
spring.flyway.default-schema=pricing
spring.flyway.schemas=pricing
spring.jpa.properties.hibernate.default_schema=pricing
spring.jpa.hibernate.ddl-auto=validate

# Never baseline: a non-empty "pricing" schema without Flyway history fails
# startup instead of having its first migration silently skipped.
spring.flyway.baseline-on-migrate=false
