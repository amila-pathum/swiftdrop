spring.application.name=notification-service

server.port=${NOTIFICATION_SERVICE_PORT:8087}

# Notification Service owns notification_db and connects as notification_service; no other service uses this
# database. The databases and users are created by
# infrastructure/docker/postgres/init (see the root README).
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/notification_db
spring.datasource.username=notification_service
spring.datasource.password=${NOTIFICATION_DB_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only
# checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Verifies JWTs issued by the Identity Service (same JWT_SECRET); see
# config/SecurityConfig.
swiftdrop.jwt.secret=${JWT_SECRET}

server.error.include-message=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:swiftdrop}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# RabbitMQ Listener Retry Configuration
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=5000ms

# Reject messages after retry attempts are exhausted
spring.rabbitmq.listener.simple.default-requeue-rejected=false

swiftdrop.internal.webhook-token=${INTERNAL_WEBHOOK_TOKEN:}
swiftdrop.merchant-service-url=${MERCHANT_SERVICE_URL:http://localhost:8083}