
[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "swiftdrop-ai-service"
version = "0.1.0"
description = "AI Delivery Assistant for SwiftDrop"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "PyJWT>=2.10,<3",
    "google-genai>=2.34,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]
